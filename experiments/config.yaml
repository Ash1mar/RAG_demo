# Central configuration for reproducible experiments.
# Edit paths/settings here instead of touching production scripts.
database:
  sqlite_path: data/tasks.db  # default demo DB generated by scripts/init_tasks_sqlite.py

data:
  seed_questions: scripts/questions.txt
  eval_questions: scripts/questions.txt
  reference_answers: experiments/golden_answers.jsonl  # optional JSONL with {"question","answer"} for metrics

pipeline:
  retriever_top_k: 8
  sql_retry_limit: 2
  answer_temperature: 0.1

seed:
  script: scripts/init_tasks_sqlite.py
  env:
    DATA_DIR: data

models:
  baseline:
    description: "Provide a command (shell string) to run your baseline."
    command: ""
    shell: false
    output_path: experiments/artifacts/baseline_latest.jsonl
    temperature: 0.0
    max_retries: 0
  system:
    endpoint: http://localhost:8000/tasks/ask
    timeout: 120
    question_file: scripts/questions.txt
    output_path: experiments/artifacts/system_latest.jsonl
    temperature: 0.2
    max_retries: 2

artifacts:
  root: experiments/artifacts
  metrics_path: experiments/artifacts/metrics.json
  report_path: experiments/artifacts/report.md

report:
  title: "RAG-to-SQL Experimental Snapshot"
  author: "CNPE RAG Team"
